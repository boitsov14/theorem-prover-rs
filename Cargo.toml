[package]
name = "theorem-prover-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
divan = { version = "0.1.21", optional = true }
indexmap = "2.9.0"
itertools = "0.14.0"
log = "0.4.27"
log4rs = "1.3.0"
maplit = "1.0.2"
mimalloc = "0.1.46"
peg = "0.8.5"
regex = "1.11.1"
rustc-hash = "2.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.12.0"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
typed-arena = "2.0.2"
unicode-normalization = "0.1.24"

[dev-dependencies]
insta = "1.43.1"
test-case = "3.3.1"

[features]
bench = ["divan"]

[[bench]]
name = "bench"
harness = false
required-features = ["bench"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# pedantic
similar_names = "allow"
enum_glob_use = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
match_wildcard_for_single_variants = "allow"
module_name_repetitions = "allow"
inline_always = "allow"
# nursery
missing_const_for_fn = "allow"
